# CSharpier settings for C# under Unity/. JSON files can't hold comments, so the setup
# instructions for .config/dotnet-tools.json live here too.
#
# Check locally: dotnet tool restore && dotnet csharpier check Unity/
# Format locally: dotnet csharpier format Unity/
# Do the one-time reformat of existing C# in its own PR, after
#      feature/us-1-define-agent-inputs has merged, to avoid conflicts with it.
#
printWidth: 100
useTabs: false
indentSize: 4
endOfLine: auto
