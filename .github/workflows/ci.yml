# Entry point for all CI. This is the only workflow (besides release.yml) with real
# triggers; every other workflow in this folder is a reusable workflow (`on: workflow_call`)
# that this file calls. Add a new `uses:` job here only when a new workflow file is created.
#
# Branch protection on `main` should require ONLY the `ci-ok` job. Jobs skipped by path
# filters never report a status, so requiring them directly would block PRs forever.
#
# `ci-ok` must list every job in `needs`, so it fails if any job that ran failed.
# Manual runs (workflow_dispatch) skip change detection and run every job.

# Note: If Task 6 decides the generated C# code lives somewhere other than a Generated/ folder, 
# update the proto filter to match.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unity: ${{ steps.filter.outputs.unity == 'true' || github.event_name == 'workflow_dispatch' }}
      python: ${{ steps.filter.outputs.python == 'true' || github.event_name == 'workflow_dispatch' }}
      proto: ${{ steps.filter.outputs.proto == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            unity:
              - 'Unity/**'
            python:
              - 'Resources/python/**'
              - 'Test/**'
              - 'Proto/**'
              - 'pytest.ini'
              - '.github/workflows/python.yml'
            proto:
              - 'Proto/**'
              - 'Unity/**/Generated/**'

  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      pull-requests: read

  unity-tests:
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    uses: ./.github/workflows/unity-tests.yml
    secrets: inherit
    permissions:
      contents: read
      checks: write

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/python.yml

  codegen-check:
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    uses: ./.github/workflows/codegen-check.yml

  smoke-test:
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    uses: ./.github/workflows/smoke-test.yml
    secrets: inherit

  ci-ok:
    if: always()
    needs: [changes, checks, unity-tests, python, codegen-check, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs that ran succeeded."
