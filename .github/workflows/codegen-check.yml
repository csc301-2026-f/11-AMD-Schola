# Regenerate with the same pinned tools used locally and compare all C# files.
# Training does not yet commit stubs; activate automatically with the first baseline.
name: Codegen check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  codegen-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # History prevents deletion of the entire baseline from disabling the check.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Detect committed C# baseline
        id: baseline
        shell: bash
        run: |
          if [[ -n "$(git log -1 --format=%H -- 'Unity/com.amd.schola/Training/Generated/*.cs')" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Codegen comparison skipped: no committed C# baseline in Unity/com.amd.schola/Training/Generated/.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Generate the baseline with: python .github/scripts/generate_csharp.py' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate generation before the first baseline
        if: steps.baseline.outputs.present != 'true'
        run: python .github/scripts/generate_csharp.py --output "$RUNNER_TEMP/schola-generated"
      - name: Verify generated C# matches Proto/
        if: steps.baseline.outputs.present == 'true'
        run: python .github/scripts/generate_csharp.py --check
