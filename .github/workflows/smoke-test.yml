# End-to-end check that a running Schola gRPC server and Schola's Python client can
# reset and step together. Called by ci.yml.
#
# Jobs:
#   mock    Always runs. Drives AMD's mock CartPole server (docker/cluster-sim/mock_ue_server.py)
#           with .github/scripts/unity_smoke_test.py, so the client side is tested before
#           Unity training exists.
#   detect  Reports whether the Unity smoke-test project exists.
#   build   Builds the Unity project as a Linux player. Skipped until the project exists.
#   run     Starts that player headless and drives it with the same script.
#
# Contract for the Unity side (build and run switch on automatically once it is met):
#   - Project:  Unity/SmokeTestProject, Unity version must match UNITY_VERSION in unity-tests.yml.
#               Packages/manifest.json references the package with "file:../../com.amd.schola".
#   - Port:     the player reads -ScholaPort=<port>, the same flag Unreal's gRPCGymConnector reads.
#               See Unity/com.amd.schola/Training/README.md (AGENT TODO for gRPC port parsing).
#   - Scene:    the only scene in Build Settings starts the gRPC GymService on launch. Agents
#               share one observation space and one action space; agents in the same environment
#               finish episodes together; episodes end within ~100 steps.
#   - Artifact: unity-smoke-build, containing SmokeTest.x86_64.
#
# AGENT BLOCKERS (do these before committing Unity/SmokeTestProject; no smoke-test.yml edits):
#   1. Meta check: update .github/scripts/check_meta_files.py so Unity projects only validate
#      Assets/ and skip ProjectSettings/ and Packages/. Docstring + inline TODO are in that file;
#      add the regression test described there in .github/scripts/tests/test_checks.py.
#   2. Port flag: Unity Training gRPC service must parse -ScholaPort=<port> (CI uses 50051).
#      Spec is in Unity/com.amd.schola/Training/README.md. Unreal reference:
#      Source/ScholaProtobuf/Private/GymConnectors/gRPC/gRPCGymConnector.cpp
#   After both land and the project is committed, detect flips to true and build/run run.

name: Smoke test

on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: false
      UNITY_EMAIL:
        required: false
      UNITY_PASSWORD:
        required: false

env:
  UNITY_VERSION: '6000.3.24f1'
  SMOKE_PROJECT: Unity/SmokeTestProject
  SMOKE_PORT: '50051'
  PYTHONUNBUFFERED: '1'

jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Resources/python/pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Schola
        run: python -m pip install -e ./Resources/python
      - name: Start mock Schola server
        run: |
          python docker/cluster-sim/mock_ue_server.py --port "$SMOKE_PORT" > mock-server.log 2>&1 &
          echo $! > mock-server.pid
      - name: Run smoke test against mock server
        run: python .github/scripts/unity_smoke_test.py --port "$SMOKE_PORT" --steps 200 --timeout 60
      - name: Stop mock server
        if: always()
        run: kill "$(cat mock-server.pid)" 2>/dev/null || true
      - name: Upload mock server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-mock-server-log
          path: mock-server.log
          if-no-files-found: ignore

  detect:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.project.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Unity smoke-test project
        id: project
        run: |
          if [ -f "$SMOKE_PROJECT/ProjectSettings/ProjectVersion.txt" ]; then
            enabled=true
          else
            enabled=false
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "Unity smoke-test project present at $SMOKE_PROJECT: $enabled"

  build:
    needs: detect
    if: needs.detect.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.SMOKE_PROJECT }}/Library
          key: smoke-library-${{ runner.os }}-${{ env.UNITY_VERSION }}-${{ hashFiles('Unity/SmokeTestProject/Assets/**', 'Unity/SmokeTestProject/Packages/**', 'Unity/SmokeTestProject/ProjectSettings/**', 'Unity/com.amd.schola/**') }}
          restore-keys: |
            smoke-library-${{ runner.os }}-${{ env.UNITY_VERSION }}-
      - name: Build Linux player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.SMOKE_PROJECT }}
          targetPlatform: StandaloneLinux64
          unityVersion: ${{ env.UNITY_VERSION }}
          buildName: SmokeTest
      - name: Upload player
        uses: actions/upload-artifact@v4
        with:
          name: unity-smoke-build
          path: build/StandaloneLinux64
          retention-days: 3

  run:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download player
        uses: actions/download-artifact@v4
        with:
          name: unity-smoke-build
          path: smoke-build
      - name: Make player executable
        run: chmod +x smoke-build/SmokeTest.x86_64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Resources/python/pyproject.toml
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Schola
        run: python -m pip install -e ./Resources/python
      - name: Start Unity player
        run: |
          ./smoke-build/SmokeTest.x86_64 -batchmode -nographics -ScholaPort="$SMOKE_PORT" -logFile "$GITHUB_WORKSPACE/unity-player.log" &
          echo $! > unity-player.pid
      - name: Run smoke test against Unity player
        run: python .github/scripts/unity_smoke_test.py --port "$SMOKE_PORT" --steps 500 --timeout 120
      - name: Stop Unity player
        if: always()
        run: kill "$(cat unity-player.pid)" 2>/dev/null || true
      - name: Upload Unity player log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-unity-player-log
          path: unity-player.log
          if-no-files-found: ignore
