# Runs the Unity package's tests with GameCI. Called by ci.yml when files under Unity/ change.
#
# Prerequisites (repo Settings > Secrets and variables > Actions):
#   UNITY_LICENSE   contents of the Unity_lic.ulf file from a Personal license activated in Unity Hub
#   UNITY_EMAIL     team Unity account email
#   UNITY_PASSWORD  team Unity account password
#   See https://game.ci/docs/github/activation
#
# Runs the US1 tests in Unity/com.amd.schola/Tests/EditMode.
# Add a playmode matrix entry once PlayMode tests exist.
# Permissions are granted by the caller (ci.yml): contents: read, checks: write.

name: Unity tests

on:
  workflow_call:
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_EMAIL:
        required: true
      UNITY_PASSWORD:
        required: true

jobs:
  unity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # D1/planning.md does not pin an editor version. Use the exact version in
      # deliverables/D1/Unity-UI-Mockup/HOW-TO-VIEW-MOCKUP.md.
      UNITY_VERSION: '6000.3.24f1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # Retain the requested Library cache, but GameCI currently creates a
      # temporary project in package mode and does not support caching it.
      # https://game.ci/docs/github/test-runner/#caveats
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Unity/com.amd.schola/Library
          key: unity-library-${{ runner.os }}-${{ env.UNITY_VERSION }}-editmode-${{ hashFiles('Unity/com.amd.schola/**') }}
          restore-keys: |
            unity-library-${{ runner.os }}-${{ env.UNITY_VERSION }}-editmode-

      - name: Run Unity EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          packageMode: true
          projectPath: Unity/com.amd.schola
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: editmode
          artifactsPath: artifacts/unity-tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode Test Results
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+AMD.Schola.*'

      - name: Upload Unity test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath || 'artifacts/unity-tests' }}

      - name: Upload Unity coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-coverage
          path: ${{ steps.tests.outputs.coveragePath || 'CodeCoverage' }}
